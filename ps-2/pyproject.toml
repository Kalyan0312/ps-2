[project]
name = "lidar-adaptive-mapping"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "pydantic",
    "pyyaml",
    "websockets",
    "httpx"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.vercel]
entrypoint = "backend.api.main:app"
